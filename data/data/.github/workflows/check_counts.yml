name: 閉店時カウントのチェック

on:
  push:
    branches: [main]
    paths:
      - "data/counts/**.json"
  workflow_dispatch:
    inputs:
      target_file:
        description: "手動実行時に対象にするファイルパス(省略可、例: data/counts/2026-09-03_2115.json)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 在庫チェックを実行
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          python scripts/check_counts.py "${{ github.event.inputs.target_file }}"
