name: 備品個数チェック

on:
  push:
    paths:
      - "data/counts/**.json"
  workflow_dispatch:
    inputs:
      target_file:
        description: "対象ファイル(例: data/counts/2026-10-17_1245_ab12.json)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 変更されたカウントファイルをチェック
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          set -e
          if [ -n "${{ github.event.inputs.target_file }}" ]; then
            python scripts/check_counts.py "${{ github.event.inputs.target_file }}"
          else
            git diff --name-only HEAD^ HEAD -- data/counts/ | while read -r f; do
              if [ -f "$f" ]; then
                echo "処理中: $f"
                python scripts/check_counts.py "$f"
              fi
            done
          fi
